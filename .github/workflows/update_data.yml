name: Update UK MP Financial Independence Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: uk_integrity_index
        run: pip install -r requirements.txt

      - name: Update MP data
        working-directory: uk_integrity_index
        run: python update_data.py

      - name: Commit updated data
        working-directory: uk_integrity_index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scores.csv data/interests.csv.gz data/last_update.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatically update MP financial interests"
            git push
          fi
